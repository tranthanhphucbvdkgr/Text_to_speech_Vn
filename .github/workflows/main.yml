name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Tự động chạy khi push code lên nhánh main (đổi thành master nếu repo của bạn dùng master)

# Cấp quyền cho GitHub Actions để tạo và ghi dữ liệu lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Hủy các tiến trình build cũ nếu bạn push code mới liên tục để tiết kiệm tài nguyên
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Bản Node.js LTS ổn định
          cache: 'npm'

      - name: Cài đặt thư viện (Dependencies)
        run: npm ci

      - name: Build dự án Vite
        run: npm run build

      - name: Cấu hình môi trường GitHub Pages
        uses: actions/configure-pages@v4

      - name: Tải lên sản phẩm Build (Thư mục dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Thư mục chứa code đã biên dịch của Vite

      - name: Tiến hành Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
