name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # Tự động chạy khi bạn push code lên nhánh main (đổi thành master nếu repo của bạn dùng master)

# Cấp quyền cho GitHub Actions để build và deploy
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Sử dụng Node v20 ổn định nhất hiện tại
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Cài đặt các thư viện trong package.json

      - name: Build project
        run: npm run build # Chạy lệnh build ra thư mục dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Chỉ định thư mục Vite build ra để deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
